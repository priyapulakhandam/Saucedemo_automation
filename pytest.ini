[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --html=reports/report.html --self-contained-html
markers =
    smoke: Smoke test cases
    login: Login test cases (happy path and negative)
    cart: Shopping cart test cases
    checkout: Checkout workflow test cases
    data_driven: Tests driven by external data sources
